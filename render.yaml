services:
  - type: web
    name: tri-buddy-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app
    envVars:
      - key: PORT
        value: 10000
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: OPENROUTER_MODELS
        value: nvidia/nemotron-3-ultra-550b-a55b:free,qwen/qwen3.8-27b:free,apodex/apodex-1.1-mini:free
      - key: OPENROUTER_TIMEOUT
        value: 25
      - key: HEALTH_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SLACK_LEAD_CHANNEL
        value: lead_hub
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
