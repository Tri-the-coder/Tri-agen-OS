name: Daily SEO and traffic report

# 03:00 UTC is 09:00 in Dhaka (UTC+6). GitHub's scheduler can run a few minutes
# late, which is fine for a morning report.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  seo-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the SEO audit
        env:
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
          SERVICE_URL: ${{ secrets.SERVICE_URL }}
        run: |
          # The free Render instance may be asleep; the first call can be slow.
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 180 \
            -X POST "$SERVICE_URL/tasks/seo-report" \
            -H "X-Health-Token: $HEALTH_TOKEN")
          echo "HTTP $code"
          cat /tmp/out.json
          echo
          test "$code" = "200"

      - name: Trigger the traffic report
        env:
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
          SERVICE_URL: ${{ secrets.SERVICE_URL }}
        run: |
          code=$(curl -s -o /tmp/ga.json -w '%{http_code}' --max-time 180 \
            -X POST "$SERVICE_URL/tasks/ga-report" \
            -H "X-Health-Token: $HEALTH_TOKEN")
          echo "HTTP $code"
          cat /tmp/ga.json
          echo
          test "$code" = "200"
